                          data:
                          - id: '101'
                            type: contact_workflow_state
                        current_contact_workflow_state:
                          data:
                            id: '101'
                            type: contact_workflow_state
                    meta:
                      api_version: '2.0'
              schema:
                "$ref": "#/components/schemas/ContactWorkflow"
        '422':
          description: assigning a disabled workflow returns code disabled_workflow
        '409':
          description: non-repeatable workflow already assigned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonApiError409"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - contact_workflow
                    attributes:
                      type: object
                      properties:
                        workflow_id:
                          type: integer
                          example: 42
